name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # attach the exe to a release on version tags

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mitmproxy pystray pillow pyinstaller
      - run: python app\test_tlspeek.py
        timeout-minutes: 10
      - run: pyinstaller --onefile --name tlspeek --hidden-import pystray._win32 --add-data "ui;ui" --add-data "app/addon.py;." app/tlspeek.py
      - uses: actions/upload-artifact@v4
        with:
          name: tlspeek-exe
          path: dist/tlspeek.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} dist/tlspeek.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
