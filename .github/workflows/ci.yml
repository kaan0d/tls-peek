name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # attach the exe to a release on version tags

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version below
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: UI scripts parse
        shell: bash
        run: for f in ui/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - run: node app/test_curl.mjs
      - run: npm i --no-save --no-package-lock playwright-core@1.49.0  # drives the runner's Chrome in test_ui.mjs
      - run: pip install mitmproxy pystray pillow pyinstaller
      - run: python app\test_tlspeek.py
        timeout-minutes: 10
      - name: Version
        shell: bash
        run: sed -i "s/^VERSION = .*/VERSION = \"$(git describe --tags --always)\"/" app/version.py
      - run: python app\tlspeek.py --version
      - name: Version resource
        shell: bash
        run: |
          ver=$(git describe --tags --always)
          num=$(echo "$ver" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\1, \2, \3, 0/;t;s/.*/0, 0, 0, 0/')
          sed -i "s/@NUM@/$num/g;s/@VER@/$ver/g" app/version_info.txt
      - name: Build exe and folder
        shell: bash
        run: |
          common='--name tlspeek --icon app/icon.ico --version-file app/version_info.txt --hidden-import pystray._win32 --add-data ui;ui --add-data app/addon.py;. app/tlspeek.py'
          pyinstaller --onefile $common
          pyinstaller --onedir --distpath dist-dir --workpath build-dir $common
          powershell Compress-Archive dist-dir/tlspeek dist/tlspeek-windows.zip
      - name: SHA-256
        shell: bash
        run: cd dist && sha256sum tlspeek.exe tlspeek-windows.zip > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tlspeek
          path: |
            dist/tlspeek.exe
            dist/tlspeek-windows.zip
            dist/SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} dist/tlspeek.exe dist/tlspeek-windows.zip dist/SHA256SUMS --notes-file .github/release-notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
