name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # attach the exe to a release on version tags

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version below
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: UI scripts parse
        shell: bash
        run: for f in ui/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - run: pip install mitmproxy pystray pillow pyinstaller
      - run: python app\test_tlspeek.py
        timeout-minutes: 10
      - name: Version
        shell: bash
        run: echo "VERSION = \"$(git describe --tags --always)\"" >> app/version.py
      - run: python app\tlspeek.py --version
      - run: pyinstaller --onefile --name tlspeek --icon app/icon.ico --hidden-import pystray._win32 --add-data "ui;ui" --add-data "app/addon.py;." app/tlspeek.py
      - name: SHA-256
        shell: bash
        run: sha256sum dist/tlspeek.exe | sed 's|dist/||' > dist/tlspeek.exe.sha256 && cat dist/tlspeek.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tlspeek-exe
          path: |
            dist/tlspeek.exe
            dist/tlspeek.exe.sha256
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} dist/tlspeek.exe dist/tlspeek.exe.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
